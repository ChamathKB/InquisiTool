name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        id: coverage
        run: |
          pytest tests/ --cov-report=json 2>&1 | tee pytest_output.txt
          PCT=$(python -c "import json; d=json.load(open('coverage.json')); print(round(d['totals']['percent_covered']))")
          echo "pct=$PCT" >> $GITHUB_OUTPUT
        env:
          GEMINI_API_KEY: "dummy"
          LLM_MODEL: "gemini-2.5-flash"
          EMBEDDING_MODEL: "gemini-embedding-001"
          MONGO_URL: "mongodb://localhost:27017"
          QDRANT_URL: "http://localhost:6333"
          REDIS_URL: "redis://localhost:6379"
          KEYCLOAK_URL: "http://localhost:8080"
          KEYCLOAK_REALM: "inquisitool"
          KEYCLOAK_CLIENT_ID: "inquisitool-api"
          KEYCLOAK_CLIENT_SECRET: "dummy"

  update-badges:
    name: Update Badges
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result != 'skipped'

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "val=$VERSION" >> $GITHUB_OUTPUT

      - name: Set coverage badge colour
        id: colour
        run: |
          PCT=${{ needs.test.outputs.coverage }}
          if [ "$PCT" -ge 80 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 60 ]; then COLOR="yellow"
          else COLOR="red"
          fi
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Update version badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: inquisitool_version.json
          label: version
          message: v${{ steps.version.outputs.val }}
          color: blue

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: inquisitool_coverage.json
          label: coverage
          message: ${{ needs.test.outputs.coverage }}%
          color: ${{ steps.colour.outputs.color }}
