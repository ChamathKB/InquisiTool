[project]
name = "inquisitool"
version = "0.1.0"
description = "Agentic survey automation tool"
authors = [
    {name = "ChamathKB",email = "kaushalyabandaraatta@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "click (>=8.2.1,<9.0.0)",
    "aiohttp (>=3.12.2,<4.0.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "redis (>=6.1.0,<7.0.0)",
    "qdrant-client (>=1.14.2,<2.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "crewai[tools] (>=0.121.0,<0.122.0)",
    "google-genai (>=1.16.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
