[project]
name = "inquisitool"
version = "0.1.0"
description = "Agentic survey automation tool"
authors = [
    {name = "ChamathKB",email = "kaushalyabandaraatta@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "click (>=8.2.1,<9.0.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "pydantic (>=2.11.10,<3.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "qdrant-client (>=1.16.2,<2.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "crewai[tools] (>=1.7.2.0,<1.8.0)",
    "google-genai (>=1.16.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
