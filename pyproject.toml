[project]
name = "inquisitool"
version = "0.1.2"
description = "Agentic survey automation tool"
authors = [
    {name = "ChamathKB",email = "kaushalyabandaraatta@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "click (>=8.1.7,<8.2.0)",
    "aiohttp (>=3.13.2,<4.0.0)",
    "pydantic (>=2.11.10,<3.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "qdrant-client (>=1.16.2,<2.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "crewai[tools] (>=1.7.2.0,<1.11.0)",
    "google-genai (>=1.16.1,<2.0.0)",
    "pdfplumber (>=0.11.0,<0.12.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "gunicorn>=23.0.0,<24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
inquisitool = "inquisitool.main:inquisi"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
